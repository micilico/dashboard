dashboard.example.com {
  encode zstd gzip
  header {
    Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    X-Content-Type-Options "nosniff"
    Referrer-Policy "no-referrer"
    Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
  }

  # A generated share token is the credential for this narrow public surface.
  # Keep the Cloud Panel UI, its APIs, and every other dashboard route protected.
  @protected {
    not path /cloud-panel/download/* /cloud-panel/static/share.css /cloud-panel/static/fonts/Inter-Variable.woff2
  }
  basic_auth @protected {
    # Generate the hash with: caddy hash-password --plaintext 'your-password'
    # ATTENTION : ne committez jamais un hash réel (secret d'accès au dashboard).
    admin $2a$14$replace-with-caddy-hash
  }

  redir /cloud-panel /cloud-panel/ 308
  redir /torrent-panel /torrent-panel/ 308
  redir /prowlarr-panel /prowlarr-panel/ 308
  redir /activity /activity/ 308
  redir /storage-panel /storage-panel/ 308
  redir /media-panel /media-panel/ 308
  redir /health /health/ 308
  redir /stats-panel /stats-panel/ 308

  handle /cloud-panel/* {
    reverse_proxy 127.0.0.1:3130
  }

  handle /torrent-panel/* {
    reverse_proxy 127.0.0.1:3110
  }

  handle /prowlarr-panel/* {
    reverse_proxy 127.0.0.1:3120
  }

  handle /activity/* {
    reverse_proxy 127.0.0.1:3110
  }

  handle /storage-panel/* {
    reverse_proxy 127.0.0.1:3110
  }

  handle /media-panel/* {
    reverse_proxy 127.0.0.1:3110
  }

  handle /health/* {
    reverse_proxy 127.0.0.1:3110
  }

  handle /stats-panel/* {
    reverse_proxy 127.0.0.1:3110
  }

  reverse_proxy 127.0.0.1:3001
}
