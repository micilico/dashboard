services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.1
    container_name: homepage
    restart: unless-stopped
    # NOTE: cap_drop ALL non appliqué ici volontairement — l'image officielle
    # utilise PUID/PGID via gosu/su-exec (nécessite CAP_SETUID/SETGID au boot).
    # Testez cap_drop: [ALL] après mise à niveau avant de l'activer.
    ports:
      - "127.0.0.1:3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: ./.env
        required: false
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ./homepage:/app/config
      # - /sys:/sys:ro  # Désactivable : évite d'exposer /sys au conteneur.
      #                    Les widgets disque/CPU Homepage nécessitent ce montage.
      - /sys:/sys:ro
      # Sécurité : les variables HOMEPAGE_VAR_* (identifiants qBittorrent,
      # Prowlarr/Jellyfin) vivent dans ./.env et sont injectées dans ce
      # conteneur. Préférez des identifiants dédiés, à moindre privilège.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s

  torrent-panel:
    build:
      context: .
      dockerfile: ./torrent-panel/Dockerfile
    container_name: torrent-panel
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: "host"
    env_file:
      - path: ./torrent-panel/.env
        required: false
    environment:
      TORRENT_PANEL_HOST: 127.0.0.1
      TORRENT_PANEL_PORT: ${TORRENT_PANEL_PORT:-3110}
      TORRENT_PANEL_MEDIA_AUTOMATION_STATE_PATH: /app/data/media-automation-state.json
      TORRENT_PANEL_NOTIFICATION_STATE_PATH: /app/data/notification-state.json
      TORRENT_PANEL_AUTOMATION_RULES_STATE_PATH: /app/data/automation-rules.json
    volumes:
      - torrent-panel-data:/app/data
      - /mnt/ultra-media:/mnt/ultra-media:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3110/healthz', timeout=4)"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s

  prowlarr-panel:
    build:
      context: .
      dockerfile: ./prowlarr-panel/Dockerfile
    container_name: prowlarr-panel
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: "host"
    env_file:
      - path: ./prowlarr-panel/.env
        required: false
    environment:
      PROWLARR_PANEL_HOST: 127.0.0.1
      PROWLARR_PANEL_PORT: ${PROWLARR_PANEL_PORT:-3120}
    tmpfs:
      - /tmp:size=32m,mode=1777
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3120/healthz', timeout=4)"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s

  cloud-panel:
    build:
      context: .
      dockerfile: ./cloud-panel/Dockerfile
    container_name: cloud-panel
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: "host"
    env_file:
      - path: ./cloud-panel/.env
        required: false
    environment:
      CLOUD_PANEL_HOST: 127.0.0.1
      CLOUD_PANEL_PORT: ${CLOUD_PANEL_PORT:-3130}
      CLOUD_PANEL_MOUNT_PATH: /mnt/ultra-media
    volumes:
      - type: bind
        source: /mnt/ultra-media
        target: /mnt/ultra-media
        bind:
          propagation: rshared
      - cloud-panel-data:/app/data
    tmpfs:
      - /tmp:size=128m,mode=1777
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3130/healthz', timeout=4)"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s

  backup:
    image: python:3.12-slim
    profiles: ["tools"]
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - torrent-panel-data:/source/torrent-panel:ro
      - cloud-panel-data:/source/cloud-panel:ro
      - ${DASHBOARD_BACKUP_DIR:-./backups}:/backup
      - ./scripts/backup_volumes.py:/tool/backup_volumes.py:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    command: ["python", "/tool/backup_volumes.py"]

volumes:
  torrent-panel-data:
  cloud-panel-data:
