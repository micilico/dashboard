- Accès rapides:
    - qBittorrent:
        description: Suivi des torrents, files et actions rapides
        href: /torrent-panel/
        widget:
          type: qbittorrent
          url: http://host.docker.internal:16141
          username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
          enableLeechProgress: true
          enableLeechSize: true

    - Prowlarr:
        description: Recherche, indexeurs et captures
        href: /prowlarr-panel/
        widget:
          type: prowlarr
          url: http://host.docker.internal:16124/prowlarr
          key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"

    - Cloud:
        description: Parcourir, transférer et organiser les fichiers
        href: /cloud-panel/
        icon: cloud-upload-outline

    - Jellyfin:
        description: Bibliothèque, lectures en cours et état serveur
        widget:
          type: jellyfin
          url: "{{HOMEPAGE_VAR_JELLYFIN_URL}}"
          key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
          enableBlocks: true
          enableNowPlaying: true

- Stockage:
    - Montage média:
        description: Activité de transfert et état du stockage
        widget:
          type: customapi
          url: http://host.docker.internal:5572/core/stats
          method: POST
          requestBody: {}
          refreshInterval: 10000
          mappings:
            - field: transfers
              label: Transferts
            - field: speed
              label: Vitesse
            - field: bytes
              label: Données
            - field: errors
              label: Erreurs
